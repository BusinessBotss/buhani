<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1712">
  <meta name="description" content="Connect with Ahbineid on Snapchat and WhatsApp.">
  <title>Ahbineid · Links</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background: #0c1712;
      color: #f8f6ee;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(370px, .96fr);
    }

    .portrait {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background: #182619;
    }

    .portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 62%;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 65%, rgba(12, 23, 18, .35));
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: clamp(32px, 6.5vw, 110px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #b9b7a6;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 15px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.9rem, 7vw, 7rem);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.065em;
    }

    .handle {
      margin: 0 0 clamp(34px, 6vh, 62px);
      color: #c9ccb9;
    }

    .links { display: grid; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 17px;
      min-height: 78px;
      padding: 15px 20px;
      border: 1px solid #576453;
      border-radius: 18px;
      background: rgba(255, 255, 255, .045);
      transition: background .2s, border-color .2s, transform .2s;
    }

    .link:hover,
    .link:focus-visible {
      background: #203629;
      border-color: #c7cfaa;
      transform: translateY(-2px);
      outline: none;
    }

    .icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #e4e6d3;
      color: #122016;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .label { flex: 1; font-size: 1.07rem; font-weight: 600; }
    .sub { display: block; margin-top: 2px; color: #b9c2af; font-size: .85rem; font-weight: 400; }
    .out { color: #e2d8ae; font-size: 1.35rem; }
    .footer { margin: 40px 0 0; color: #8c9c88; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }

    @media (max-width: 760px) {
      .page { display: block; }
      .portrait { min-height: 0; height: 55svh; max-height: 560px; }
      .portrait img { object-position: center 58%; }
      .portrait::after {
        background: linear-gradient(0deg, #0c1712, transparent 45%);
      }
      .content {
        position: relative;
        margin-top: -24px;
        padding: 0 22px 40px;
      }
      h1 { font-size: clamp(3.7rem, 16vw, 6rem); }
      .handle { margin-bottom: 28px; }
      .link { min-height: 72px; }
      .footer { margin-top: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="portrait">
      <img
        src="https://res.cloudinary.com/dqje367sj/image/upload/v1790696484/67EDA5A4-8280-44F8-A40B-0DA1CE50A1F9_j4nvyz.png"
        alt="Ahbineid sentado en un jardín tropical"
      >
    </div>

    <section class="content" aria-label="Contact links">
      <p class="eyebrow">Connect with me</p>
      <h1>Ahbineid.</h1>
      <p class="handle">Snapchat & WhatsApp</p>

      <nav class="links" aria-label="Contact profiles">
        <a
          class="link"
          href="https://snapchat.com/t/3PVPkdZk"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">S</span>
          <span class="label">
            Snapchat
            <span class="sub">Find me on Snap</span>
          </span>
          <span class="out" aria-hidden="true">↗</span>
        </a>

        <a
          class="link"
          href="https://wa.me/96556666688"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">✆</span>
          <span class="label">
            WhatsApp
            <span class="sub">+965 566 66688</span>
          </span>
          <span class="out" aria-hidden="true">↗</span>
        </a>
      </nav>

      <p class="footer">Stay connected</p>
    </section>
  </main>
</body>
</html>
